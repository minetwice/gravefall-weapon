# ============================================================
#  GRAVEFALL - The Corrupted Hammer of the Fallen Kingdom
# ============================================================

# CustomModelData values used by the plugin + resource pack.
custom-model-data: 7401          # hammer (netherite axe)
custom-model-data-portal: 7402   # portal plane (paper icon -> RP model)
custom-model-data-crystal: 7403  # floating soul crystals (paper icon -> RP model)

weapon:
  # Keep the GRAVEFALL hammer in your inventory when you die.
  keep-on-death: true

abilities:
  soul-spiral:
    enabled: true
    cooldown: 8        # seconds
    damage: 5.0
    knockback: 1.5
  ground-slam:
    enabled: true
    cooldown: 22       # seconds
    damage: 4.0
    launch-power: 1.15
  meteor:
    enabled: true
    cooldown: 25       # seconds
    damage: 10.0
    lifetime-seconds: 10
  combo-hits: 3        # melee hits needed to trigger the meteor
  soul-harvest:
    # Killing a player WITH the hammer heals the wielder.
    heal: 4.0

deaths:
  # A player is banned after dying more than this many times.
  max-deaths: 3
  ban-reason: "The corruption has claimed your soul... you have fallen too many times."

structure:
  radius: 250            # overworld /gravefall structure area (500x500)
  blocks-per-tick: 1200  # generation speed (higher = faster but laggier)

dimension:
  world-name: gravefall_dimension
  island-radius: 380      # floating blue soul island size
  kingdom-radius: 200     # feature spread of the kingdom inside the dimension

portal:
  # Rift portals that tear open inside the dimension after the hammer is claimed.
  return-portals: 6

mobs:
  frost-frogs: 10        # freezing frogs in the dimension
  soul-wisps: 8          # glowing wisps
  grave-sentinels: 5     # wither skeleton guards
  frog-damage: 3.0
  frog-freeze-seconds: 2

ritual:
  required-fragments: 5
  charge-seconds: 600    # 10 minutes altar awakening time
